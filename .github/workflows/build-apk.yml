name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot, templates and Android signing
        run: |
          set -e
          TARGET=$HOME/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$TARGET" ~/.config/godot
          SRC=$(find / -type f -name android_debug.apk -path "*export_templates*" 2>/dev/null | head -1 || true)
          if [ -n "$SRC" ]; then
            cp -r "$(dirname "$SRC")"/. "$TARGET"/
          else
            curl -fsSL -o /tmp/t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q /tmp/t.tpz -d /tmp/tpl
            cp -r /tmp/tpl/templates/. "$TARGET"/
          fi
          ls "$TARGET" | head -30
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot --headless --editor --quit || true
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          for f in ~/.config/godot/editor_settings-*.tres; do
            [ -f "$f" ] || continue
            {
              echo "export/android/android_sdk_path = \"/usr/lib/android-sdk\""
              echo "export/android/java_sdk_path = \"$JAVA_DIR\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo "export/android/debug_keystore_user = \"androiddebugkey\""
              echo "export/android/debug_keystore_pass = \"android\""
              echo "export/android/force_system_user = false"
              echo "export/android/shutdown_adb_on_exit = true"
            } >> "$f"
          done

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/BaytAlGhaba.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlGhaba-apk
          path: build/BaytAlGhaba.apk
